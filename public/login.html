<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediMind - Log in</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 data-i18n="appName">MediMind</h1>
    <button id="langToggle" class="lang-toggle" onclick="toggleLanguage()">RW</button>
  </header>

  <main class="container">
    <div class="card">
      <h2 data-i18n="loginTitle">Welcome back</h2>
      <p data-i18n="loginSubtitle">Log in to see today's medications and appointments.</p>

      <form id="loginForm">
        <div class="form-field">
          <label for="email" data-i18n="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-field">
          <label for="password" data-i18n="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>

        <button type="submit" class="btn" data-i18n="logIn">Log in</button>
        <p class="error-message" id="errorMessage"></p>
      </form>

      <p class="link-row">
        <span data-i18n="newToMediMind">New to MediMind?</span>
        <a href="register.html" data-i18n="createAnAccount">Create an account</a>
      </p>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
