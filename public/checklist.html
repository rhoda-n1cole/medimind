<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediMind - Checklist</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 data-i18n="dailyChecklist">Today's checklist</h1>
    <button id="langToggle" class="lang-toggle" onclick="toggleLanguage()">RW</button>
  </header>

  <main class="container">
    <p class="link-row"><a href="dashboard.html" data-i18n="backToDashboard">Back to dashboard</a></p>

    <div class="card">
      <ul class="medication-list" id="checklistList"></ul>
      <p id="noDosesMessage" data-i18n="noDosesToday" style="display: none;">No doses scheduled today.</p>
    </div>

    <div class="card">
      <h2 data-i18n="weeklySummary">Weekly summary</h2>
      <p id="weeklySummaryText"></p>
      <div style="background-color: var(--color-border); border-radius: 999px; height: 10px; overflow: hidden;">
        <div id="weeklySummaryBar" style="background-color: var(--color-taken); height: 100%; width: 0%;"></div>
      </div>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/checklist.js"></script>
</body>
</html>
